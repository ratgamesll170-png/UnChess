name: Build UnChess for Android
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test rules on Linux (perft + fuzz)
        run: |
          g++ -O2 -std=c++17 -pthread unchess.cpp -o unchess_linux
          ./unchess_linux test

      - name: Build Android binaries (NDK)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p out
          "$BIN/aarch64-linux-android24-clang++" -O2 -std=c++17 -fPIE -pie -static-libstdc++ unchess.cpp -o out/unchess-arm64
          "$BIN/armv7a-linux-androideabi24-clang++" -O2 -std=c++17 -fPIE -pie -static-libstdc++ unchess.cpp -o out/unchess-armv7
          "$BIN/llvm-strip" out/unchess-arm64 out/unchess-armv7
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: unchess-android
          path: out/
